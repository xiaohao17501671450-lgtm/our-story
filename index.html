<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>给淑君 · 农历七月初一</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+SC:wght@300;400&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/home.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="moon"></span>
    <span class="glow g1"></span>
    <span class="glow g2"></span>
  </div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <button type="button" class="music" id="musicBtn" title="因为爱情" aria-label="音乐">♪</button>

  <main class="letter">
    <p class="seal">农历二〇二六 · 七月初一</p>
    <span class="flourish" aria-hidden="true"></span>
    <p class="to">致 郭淑君</p>
    <h1>生日快乐</h1>
    <p class="heart" aria-hidden="true">♡</p>

    <figure class="cameo">
      <img src="assets/photos/20200821_valid_JWJS6535.jpg" alt="淑君" />
    </figure>

    <p class="verse">物有尽时，心无涯岸。</p>
    <p class="body">
      能捧在手里的，终会旧去；<br />
      能放进心里的，才会一直新。<br />
      这一年，我不想再给你一件会落灰的东西——<br />
      想把我们从仙桃走到今天的路，<br />
      一页一页叠起来，放进你掌心。
    </p>
    <p class="wish">愿你喜欢这份，只能用心打开的礼物。</p>
    <p class="sign">亲爱的老公</p>

    <a class="open" href="book.html">翻开《来时路》</a>
    <p class="hint">轻轻点开，里面是我们</p>
  </main>

  <audio id="bgm" loop preload="auto" playsinline webkit-playsinline>
    <source src="assets/music/yinwei-aiqing.mp3" type="audio/mpeg" />
  </audio>
  <script src="assets/home.js"></script>
  <script src="assets/bgm.js"></script>
</body>
</html>
